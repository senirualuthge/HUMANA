version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://humana:password@db:5432/humana_v2
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: ankane/pgvector
    environment:
      POSTGRES_USER: humana
      POSTGRES_PASSWORD: password
      POSTGRES_DB: humana_v2
    ports:
      - "5432:5432"

  conversation-service:
    build: ./conversation-service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://humana:password@db:5432/humana_v2
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
